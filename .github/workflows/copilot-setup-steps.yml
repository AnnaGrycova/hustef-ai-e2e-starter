# Setup steps for the GitHub Copilot coding agent (paid Copilot plans). Generated by
# `npx playwright init-agents --loop=vscode` (Playwright 1.63.0) and corrected for this repo.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Playwright 1.63 generates a "npx run build" step here, which fails: there is no
    # build step in this repo (the app under test is deployed at GREMLIN_URL).
    - name: Create .env from the example
      run: cp .env.example .env
